<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade 2</title>
</head>
<body>
    
<script>
const pi = 3.1415
let raio = parseFloat(prompt("Digite o raio do circulo em cm: "))
let perimetro = (2 * pi * raio)
let area = pi * (raio * raio)

document.write("O perimetro do circulo é: "+perimetro.toFixed(2)+"cm<br>")
document.write("A area do circulo é: "+area+"cm<br>")


</script>

</body>
</html>
