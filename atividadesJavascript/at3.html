<body>
    
<script>
let base = parseFloat(prompt("Digite a base do triangulo em cm: "))
let altura = parseFloat(prompt("Digite a altura do triangulo em cm: "))

let area = (base * altura)/2

document.write("A area do triangulo é: "+area+"cm<br>")


</script>
