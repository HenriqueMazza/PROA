<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade 39</title>
</head>
<body>
    <script>

        let i = 1;
        let numero = 0
        let numeroSoma = 0
        let media = 0

        while (i <= 5){
            numero = parseInt(prompt("Digite o "+i+" numero: "))
            numeroSoma = numeroSoma + numero
            i++
        }

        media = numeroSoma/5
        document.write("A media dos 5 numeros é: "+media)

    </script>
</body>
</html>
