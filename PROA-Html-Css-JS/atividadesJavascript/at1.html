<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>
</head>
<body>

<script>
    let num1 = Number(prompt("Digite o primeiro numero: "))
    let num2 = Number(prompt("Digite o segundo numero: "))

    let soma = num1+num2
    let sub = num1-num2
    let multi = num1*num2
    let div = num1/num2

    document.write("A soma dos dois numeros é: " +soma+"<br>")
    document.write("A subtracao dos dois numeros é: " +sub+"<br>")
    document.write("A multiplicacao dos dois numeros é: " +multi+"<br>")
    document.write("A divisao dos dois numeros é: " +div+"<br>")

</script>
    
</body>
</html>
