<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch case dias da semana</title>
</head>
<body>
    
<script>
let semana = prompt("Digite um numero entre 1 e 7 para exibir o dia da semana correspondente: ")

    switch(semana){
        case "1":
            alert("domingo!")
            break
        case "2":
            alert("segunda-feira!")
            break
        case "3":
            alert("terca-feira!")
            break
        case "4":
            alert("quarta-feira")
            break
        case "5":
            alert("quinta-feira")
            break
        case "6":
            alert("sexta-feira")
            break
        case "7":
            alert("sábado")
            break
            default:
                alert("Dia da semana invalido")
                break
    }


</script>

</body>
</html>
