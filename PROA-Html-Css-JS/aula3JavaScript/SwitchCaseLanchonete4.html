<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando switch case</title>
</head>
<body>
    <h1>Lanchonete Legal</h1>

<script>
    let continuar = 1
    let pedidos=[]

    while (continuar === 1){

        let escolha = prompt("Escolha seu pedido: [1] - hamburguer, [2] - nuggets, [3] - batata frita, [4] - refrigerante, [5] - combo com tudo")

    switch (escolha) {
        case "1":
            pedidos.push("hamburger") //.push adiciona um valor a uma string
            break
        case "2":
            pedidos.push("nuggets")
            break
        case "3":
            pedidos.push("batata frita")
            break
        case "4":
            pedidos.push("refrigerante")
            break
        case "5":
            pedidos.push("combo com tudo")
            break 
            
        default:
            document.write("Pedido invalido")
    }
        continuar = Number(prompt("Deseja continuar pedindo? [1] - sim, [2] - nao"))
    }   

    document.write("os itens pedidos foram: "+pedidos)

</script>

</body>
</html>
