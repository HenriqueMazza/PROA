<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repeticao - FOR</title>
</head>
<body>
    
<script>

let texto = prompt("Digite algo para ser repetido 100 vezes")  
  
for(let i=1; i<=100; i++){
    document.write(texto+" ",i+"<br>")
}

</script>

</body>
</html>
