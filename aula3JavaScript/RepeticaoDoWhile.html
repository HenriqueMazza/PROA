<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repeticao DO WHILE</title>
</head>
<body>
    
<script>

    let i = 1
    let soma = 0

    do{
        numero = Number(prompt("Digite 1 numero: "))
        soma = soma + numero
        i++

    } while(i<=10)
    document.write("A soma dos 10 numeros é: "+soma)
    
</script>

</body>
</html>
