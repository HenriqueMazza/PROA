<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javaScript 3 teste</title>
</head>
<body>
    <h1>Fazendo calculos com o javascript</h1>

    <script>
        let numero1 = parseFloat(prompt("Entre com o primeiro numero"))
        let numero2 = parseFloat(prompt("Entre com o segundo numero"))

        document.write("o primeiro numero inserido foi: "+numero1+"<br>")
        document.write("o segundo numero inserido foi: "+numero2+"<br><br>")

        let soma = numero1 + numero2
        let sub = numero1 - numero2
        let multi = numero1 * numero2
        let div = numero1 / numero2

        document.write("A soma dos dois numeros é: "+soma+"<br>")
        document.write("A subtracao dos dois numeros é: "+sub+"<br>")
        document.write("A multiplicacao dos dois numeros é: "+multi+"<br>")
        document.write("A divisao dos dois numeros é: "+div+"<br>")

    </script>
    
</body>
</html>
