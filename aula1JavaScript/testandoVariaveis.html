<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando variaveis</title>
</head>
<body>
<h1>Testando variaveis</h1>
    <script>
        let idade = 53 //variavel tipo inteiro
        let peso = 77.2 //variavel tipo float
        let altura = 1.78
        let nome = "Henrique" //variavel do tipo string (letras, numeros e caracteres especiais)

        document.write("Meu nome é: "+nome+"<br>")
        document.write("Meu peso é: "+peso+"<br>")
        document.write("Minha idade é: "+idade+"<br>")
        document.write("Minha altura é: "+altura+"<br>")

    </script>
    
</body>
</html>
