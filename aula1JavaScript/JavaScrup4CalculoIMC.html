<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo IMC</title>
</head>
<body>

    <h1>Calculando IMC</h1>

    <script>
        let peso = parseFloat(prompt("Digite seu peso em KG: <br>"))
        let altura = parseFloat(prompt("Digite sua altura em metros: <br>"))

        let IMC = peso / (altura * altura)

        document.write("O seu IMC é: "+IMC.toFixed(2)+"<br><br>")

        if (IMC >= 15 && IMC <= 18.5){
            document.write("Voce esta abaixo do peso!")
        } else if (IMC >= 18.6 && IMC <= 24.9){
            document.write("Voce esta com um peso normal!")
        } else if (IMC >= 25 && IMC <= 29.9){
            document.write("Voce esta acima do peso!")
        } else if (IMC >= 30 && IMC <= 39.9){
            document.write("Voce esta com obesidade grau 1!")
        } else if (IMC >= 40){
            document.write("Voce esta com obesidade grau 2!")
        } else {
            document.write("Voce esta MUITO abaixo do peso")
        }

    </script>
    
</body>
</html>
